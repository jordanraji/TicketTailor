name: Relay CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: lint · type-check · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # The relay has an editable path dependency on ../api; the checkout
      # includes both, so the locked sync resolves it.
      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type check (mypy, strict)
        run: uv run mypy -p relay

      # Integration tests spin up a real PostGIS container via testcontainers
      # (Docker is available on ubuntu-latest), mirroring the API harness.
      - name: Tests (pytest)
        run: uv run pytest
