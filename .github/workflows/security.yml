name: Security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    name: SAST · dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      # SAST over application source (ADR-0009). Test dirs are excluded via
      # [tool.bandit] in pyproject.toml so assert-based tests don't trip B101.
      - name: SAST (bandit)
        run: uv run bandit -c pyproject.toml -r src/tickettailor

      # Dependency CVE audit (ADR-0009). Audits the locked environment.
      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

  web-audit:
    name: SAST · dependency audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      # Dependency CVE audit (ADR-0009). High-or-above threshold so the two
      # known moderate transitive advisories (Next/postcss) do not hard-fail CI.
      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
