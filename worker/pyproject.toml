[project]
name = "tickettailor-worker"
version = "0.1.0"
description = "TicketTailor Notification Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools[parser]>=2.40.0",
    "httpx>=0.28.0",
    "pydantic[email,timezone]>=2.0",
    "pydantic-settings>=2.0",
    "pywebpush>=1.14.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N"]
ignore = ["B008"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
